<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - FitZone</title>
    <meta name="description" content="Escríbenos para más información sobre FitZone.">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>FitZone</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="sobre-nosotros.html">Nosotros</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html" class="activo">Contacto</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contáctanos</h2>
            <p>Si tienes dudas sobre precios o horarios, escríbenos.</p>

            <form action="#" method="post">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo</label>
                <input type="email" id="email" name="email" required>

                <label for="asunto">Asunto</label>
                <select id="asunto" name="asunto" required>
                    <option value="">Elige una opción</option>
                    <option value="precio">Precios</option>
                    <option value="horario">Horarios</option>
                    <option value="otro">Otro</option>
                </select>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

                <button type="submit">Enviar</button>
            </form>

            <p class="direccion">
                Estamos en Calle Martí #123, Pinar del Río.<br>
                Teléfono: +53 53435710
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FitZone. Pinar del Río, Cuba.</p>
    </footer>

</body>
</html>
