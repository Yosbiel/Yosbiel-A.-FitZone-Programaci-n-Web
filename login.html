<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - FitZone</title>
    <meta name="description" content="Inicia sesión en FitZone.">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>FitZone</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="sobre-nosotros.html">Nosotros</a>
            <a href="servicios.html">Servicios</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html" class="activo">Entrar</a>
        </nav>
    </header>

    <main>
        <section class="login">
            <h2>Iniciar sesión</h2>

            <form action="#" method="post">
                <label for="usuario">Correo o usuario</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="pass">Contraseña</label>
                <input type="password" id="pass" name="pass" required>

                <div class="recordar">
                    <input type="checkbox" id="recordar" name="recordar">
                    <label for="recordar">Recordarme</label>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <p><a href="#">¿Olvidaste tu contraseña?</a></p>
            <p>¿No tienes cuenta? <a href="contacto.html">Regístrate</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 FitZone. Pinar del Río, Cuba.</p>
    </footer>

</body>
</html>
